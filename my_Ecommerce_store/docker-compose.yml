services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kkstore-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 5000
      UPSTREAM_API_URL: ${UPSTREAM_API_URL:-https://dummyjson.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://65.0.203.128:6000}
    expose:
      - "5000"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://65.0.203.128:5000/api}
    container_name: kkstore-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-6000}:80"
