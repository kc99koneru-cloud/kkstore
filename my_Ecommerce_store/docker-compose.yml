services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kkstore-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      HOST: ${HOST}
      PORT: ${BACKEND_CONTAINER_PORT}
      UPSTREAM_API_URL: ${UPSTREAM_API_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    expose:
      - "${BACKEND_CONTAINER_PORT}"
    ports:
      - "${BACKEND_PORT}:${BACKEND_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: kkstore-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOST: ${HOST}
      PORT: ${FRONTEND_CONTAINER_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_CONTAINER_PORT}"
